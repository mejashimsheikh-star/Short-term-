<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShortTrade</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="logo">
            <h2>ShortTrade</h2>
        </div>

        <button id="connectWallet">
            Connect Coinbase Wallet
        </button>

    </header>

    <!-- Dashboard -->

    <section class="dashboard">

        <div class="card">
            <h3>User ID</h3>
            <p id="userId">Loading...</p>
        </div>

        <div class="card">
            <h3>Wallet</h3>
            <p id="walletAddress">
                Not Connected
            </p>
        </div>

        <div class="card">
            <h3>Portfolio</h3>
            <p>
                $
                <span id="portfolio">
                    0.00
                </span>
            </p>
        </div>

    </section>

    <!-- Live Market -->

    <section class="market">

        <h2>
            Live Market
        </h2>

        <div id="marketContainer">

        </div>

    </section>

    <!-- Trade -->

    <section class="trade">

        <h2>
            Demo Trade
        </h2>

        <select id="coin">

            <option value="bitcoin">
                Bitcoin
            </option>

            <option value="ethereum">
                Ethereum
            </option>

            <option value="binancecoin">
                BNB
            </option>

            <option value="solana">
                Solana
            </option>

            <option value="ripple">
                XRP
            </option>

            <option value="tether">
                USDT
            </option>

        </select>

        <input
            type="number"
            id="amount"
            placeholder="Amount">

        <div class="buttons">

            <button id="buyButton">
                Buy
            </button>

            <button id="sellButton">
                Sell
            </button>

        </div>

    </section>

    <!-- History -->

    <section class="history">

        <h2>
            Trade History
        </h2>

        <div id="history">

            No Trades

        </div>

    </section>

    <script src="app.js"></script>

    <script src="wallet.js"></script>

    <script src="market.js"></script>

    <script src="trade.js"></script>

</body>

</html>
