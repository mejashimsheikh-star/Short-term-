<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">
<title>ShortTrade</title>
<!-- Main CSS -->
<link
    rel="stylesheet"
    href="style.css">
<!-- Google Fonts -->
<link
    rel="preconnect"
    href="https://fonts.googleapis.com">
<link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet">
</head>
<body>
<!-- =========================
     HEADER
========================== -->
<header class="header">
    <div class="logo">
        <h2>BEcoin</h2>
    </div>
    <button
        id="connectWallet"
        type="button">
        Connect Wallet
    </button>
</header>
<!-- =========================
     MAIN CONTENT
========================== -->
<main>
    <!-- =====================
         DASHBOARD
    ====================== -->
    <section class="dashboard">
        <!-- User ID -->
        <div class="card">
            <h3>
                User ID
            </h3>
            <p id="userId">
                Loading...
            </p>
        </div>
        <!-- Wallet -->
        <div class="card">
            <h3>
                Wallet
            </h3>
            <p id="walletAddress">
                Not Connected
            </p>
        </div>
        <!-- Portfolio -->
        <div class="card">
            <h3>
                Portfolio
            </h3>
            <p>
                $
                <span id="portfolio">
                    0.00
                </span>
            </p>
        </div>
    </section>
    <!-- =====================
         LIVE MARKET
    ====================== -->
    <section class="market">
        <h2>
            Live Market
        </h2>
        <div id="marketContainer">
            Loading market...
        </div>
    </section>
    <!-- =====================
         TRADE
    ====================== -->
    <section class="trade">
        <h2>
            Trade
        </h2>
        <!-- Coin Selection -->
        <select id="coin">
            <option value="bitcoin">
                Bitcoin
            </option>
            <option value="ethereum">
                Ethereum
            </option>
            <option value="binancecoin">
                BNB
            </option>
            <option value="solana">
                Solana
            </option>
            <option value="ripple">
                XRP
            </option>
            <option value="tether">
                USDT
            </option>
        </select>
        <!-- Amount -->
        <input
            type="number"
            id="amount"
            placeholder="Amount"
            min="0"
            step="any">
        <!-- Buy / Sell -->
        <div class="buttons">
            <button
                id="buyButton"
                type="button">
                Buy
            </button>
            <button
                id="sellButton"
                type="button">
                Sell
            </button>
        </div>
    </section>
    <!-- =====================
         TRADE HISTORY
    ====================== -->
    <section class="history">
        <h2>
            Trade History
        </h2>
        <div id="history">
            No Trades
        </div>
    </section>
</main>
<!-- =========================
     JAVASCRIPT FILES
========================== -->
<script src="app.js"></script>
<script src="wallet.js"></script>
<script src="market.js"></script>
<script src="trade.js"></script>
</body>
</html>
